<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="信息流">
<meta name="description" content="自用 RSS 信息流：订阅、分组、收藏，断网也能看已抓到的文章">
<meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="app-version" content="v1.11">
<title>信息流</title>
<script>
(function(){var t=localStorage.getItem('user-theme')||'auto';var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');})();
</script>
<style>
:root{
  color-scheme:light;
  --bg:#f6f4f1;--text:#1d1b18;--muted:#6b6862;--card:#fffdfa;--line:rgba(29,27,24,.09);
  --chip:#ebe8e3;--chip-on:#1d1b18;--chip-on-text:#f6f4f1;--accent:#2f6fd6;--danger:#c4432f;--star:#d29a1c;
  --shadow:0 8px 28px rgba(0,0,0,.08);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1a1917;--text:#f0ece5;--muted:#a49f97;--card:#24221f;--line:rgba(240,236,229,.09);
  --chip:#2c2a26;--chip-on:#f0ece5;--chip-on-text:#1a1917;--accent:#6ea8fe;--danger:#ef7a64;--star:#f0c050;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:system-ui, sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
  padding-left:var(--sal);padding-right:var(--sar)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
.wrap.wide{max-width:min(1400px,100%)}
/* 顶栏 + 筛选条：固定在顶部，向下滚动后用 transform 收起，下方用占位避免内容跳动 */
.top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);padding-top:var(--sat);padding-left:var(--sal);padding-right:var(--sar);border-bottom:1px solid var(--line);transform:translate3d(0,0,0);transition:transform .22s ease;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.top.is-hidden{transform:translate3d(0,-100%,0);pointer-events:none}
.top-spacer{height:0;flex:none;pointer-events:none}
.bar{display:flex;align-items:center;gap:6px;padding:10px 14px 4px}
.bar h1{margin:0 auto 0 0;font-size:21px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.bar h1 img{width:26px;height:26px;border-radius:6px;flex:none}
.bar h1 .title-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btnMode{min-width:auto;padding:0 8px;font-size:13px;font-weight:600;flex:none}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:14px;white-space:nowrap}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.navrow{display:flex;align-items:center;gap:6px;padding:6px 10px 10px 0;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 0 14px;flex:1;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;border:0;background:var(--chip);color:var(--text);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-text);font-weight:600}
.chip .x{margin-left:2px;opacity:.7}
.status{font-size:12px;color:var(--muted);padding:0 14px 8px;display:none}
.status.show{display:block}
.status .err{color:var(--danger)}
.prog{display:none;height:2px;margin:0;background:transparent;width:100%}
.prog.show{display:block;background:color-mix(in srgb, var(--accent) 28%, transparent)}
.prog i{display:block;height:2px;width:0;background:var(--accent);transition:width .18s ease-out}
#settings .head.set-head{flex-direction:column;align-items:stretch;padding-bottom:0}
#settings .head .head-row{display:flex;align-items:center;gap:8px;width:100%;padding-bottom:8px}
#settings .head .head-row .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-tabs{display:flex;width:calc(100% + 28px);margin:0 -14px;padding:0 6px;gap:0}
.set-tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 8px 9px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.set-tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.fresh{display:none;width:calc(100% - 28px);margin:0 14px 8px;border:0;background:var(--chip-on);color:var(--chip-on-text);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.fresh.show{display:block}
.batch-sent{height:1px;margin:0;padding:0;border:0;overflow:hidden}
/* 下拉刷新 */
.ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--muted);font-size:13px;transition:height .2s}
.ptr span{padding-bottom:8px}
/* 信息流 */
.list{padding:10px 12px calc(28px + var(--sab));display:grid;gap:8px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;width:100%;align-items:flex-start;position:relative}
.card:active{transform:scale(.995)}
.card .body{flex:1;min-width:0}
.card h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card p{margin:3px 0 0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.meta{margin-top:5px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.meta .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%;cursor:pointer}
.meta .src:hover{text-decoration:underline}
.thumb{flex:none;width:80px;height:80px;border-radius:10px;object-fit:cover;background:var(--chip)}
.card.has-thumb{align-items:flex-start}
.card.has-thumb .body{display:flex;flex-direction:column;height:80px;min-height:80px;max-height:80px;overflow:hidden}
.card.has-thumb h3{font-size:15px;line-height:1.28;-webkit-line-clamp:2;flex:none}
.card.has-thumb .thumb-gap{flex:1 1 auto;min-height:0}
.card.has-thumb p{margin:2px 0 0;font-size:13px;line-height:1.3;-webkit-line-clamp:1;flex:none}
.card.has-thumb .meta{margin-top:3px;flex:none}
.starb{border:0;background:none;padding:2px 4px;margin-left:auto;cursor:pointer;color:var(--muted);font-size:15px;line-height:1}
.starb.on{color:var(--star)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .btns{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.empty .msg{margin:0}
.more{text-align:center;color:var(--muted);font-size:13px;padding:10px}
.endline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 12px;padding:18px 16px 10px;color:var(--muted);font-size:13px;line-height:1.45;text-align:center;font-family:inherit}
.endline-text{min-width:0}
.endline-refresh{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;min-height:44px;min-width:44px;padding:10px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.endline-refresh:disabled{opacity:.55;cursor:default}
.endline-refresh:not(:disabled):active{transform:scale(.98)}
#gallery>.endline{width:100%}
.btn{border:0;background:var(--chip-on);color:var(--chip-on-text);border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
/* 阅读页与面板 */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;overscroll-behavior:contain}
.sheet.open{display:block}
.sheet .head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 14px 10px;border-bottom:1px solid var(--line);z-index:2}
.sheet .head .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader{max-width:680px;margin:0 auto;padding:18px 18px calc(48px + var(--sab))}
.reader h2{font-size:23px;line-height:1.35;margin:0 0 8px;word-break:break-word}
.reader .meta{font-size:13px;margin-bottom:16px;flex-wrap:wrap}
.content{font-size:17px;line-height:1.75;word-break:break-word;overflow-wrap:anywhere}
.content img,.content video{max-width:100%;height:auto;border-radius:8px;display:block;margin:10px auto}
.content pre{overflow-x:auto;background:var(--chip);padding:10px;border-radius:8px;font-size:14px}
.content code{font-size:.9em}
.content blockquote{margin:12px 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--muted)}
.content table{display:block;overflow-x:auto;border-collapse:collapse}
.content td,.content th{border:1px solid var(--line);padding:4px 8px}
.content figure{margin:12px 0}
.content figcaption{font-size:13px;color:var(--muted);text-align:center}
.orig{display:block;margin:26px 0 0;text-align:center}
.panel{max-width:680px;margin:0 auto;padding:14px 16px calc(40px + var(--sab))}
.panel h4{margin:22px 0 8px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.row{display:flex;gap:8px;align-items:center}
.row+.row{margin-top:8px}
input[type=text],input[type=url],input[type=number],select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;min-height:120px}
label.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fl{list-style:none;margin:0;padding:0}
.fl li{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.fl li:first-child{border-top:0}
.fl .n{flex:1;min-width:0}
.fl .n b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .n small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .n .fmeta{display:block;margin-top:3px}
.fl li .mini{flex:none;margin-top:2px}
.badge{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.err{background:rgba(196,67,47,.14);color:var(--danger)}
.badge.ok{color:var(--muted)}
.gh{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-weight:600}
.gh .sp{flex:1}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 8px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 8px}
.gitem .gtitle{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gitem .gn{flex:1;min-width:0;font-weight:600;font-size:15px}
.gitem .gsws{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.gitem.virtual{opacity:.95}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translateX(-50%);background:var(--chip-on);color:var(--chip-on-text);padding:9px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--chip);border-radius:12px;padding:2px}
.seg button{flex:1 1 0;min-width:4.2em;border:0;background:transparent;color:var(--muted);border-radius:10px;padding:7px 8px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.colctl{display:none;margin:0 4px 0 0;align-items:center;background:var(--chip);border-radius:12px;padding:2px;height:32px;flex:none}
.colctl.on{display:inline-flex}
.colctl button{border:0;background:transparent;color:var(--text);border-radius:10px;height:28px;min-width:28px;padding:0 7px;font:inherit;font-size:16px;line-height:1;cursor:pointer}
.colctl button:disabled{opacity:.35}
.colctl #colAuto{min-width:36px;padding:0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.colctl #colAuto[data-manual="true"]{color:var(--text)}
.gmode{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.gmode label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:36px}
.gmode input{accent-color:var(--accent)}
.verbox .ver{margin:0 0 8px;font-size:14px}
.verbox details{border-top:1px solid var(--line);padding-top:8px}
.verbox summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.verbox summary::-webkit-details-marker{display:none}
.verbox summary:after{content:' ▾';color:var(--muted);font-weight:400}
.verbox details[open] summary:after{content:' ▴'}
.verbox ol{margin:8px 0 0;padding:0;list-style:none}
.verbox li{margin:0 0 10px;font-size:13px;color:var(--text);line-height:1.45}
.verbox li .vd{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
@media (max-width:420px){
  .bar{gap:4px;padding:8px 10px 4px}
  .bar h1{font-size:18px;gap:6px}
  .ib{height:32px;min-width:32px;padding:0 7px}
  #btnMode{padding:0 7px;font-size:12px}
}
@media (max-width:360px){
  .bar h1 .title-text{display:none}
}
/* 图流水流 */
.masonry{padding:8px 8px calc(28px + var(--sab))}
.masonry-cols{display:flex;align-items:flex-start;gap:3px}
.masonry-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px}
.masonry[hidden],.list[hidden]{display:none}
.tile{margin:0;background:transparent;border:0;border-radius:4px;overflow:hidden;cursor:pointer;display:block;width:100%;padding:0;text-align:left;color:inherit;position:relative}
.tile.show{display:block}
.tile img{width:100%;height:auto;display:block;background:var(--chip);vertical-align:middle;border-radius:4px;object-fit:unset}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;margin:0;padding:22px 8px 6px;font-size:12px;line-height:1.35;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.6));pointer-events:none;border-radius:0 0 4px 4px}
/* 大图浏览 */
.pv-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:calc(100dvh - 70px - var(--sat) - var(--sab));padding:8px 12px calc(24px + var(--sab));touch-action:pan-y}
.pv-stage img{max-width:100%;max-height:calc(100dvh - 90px - var(--sat) - var(--sab));object-fit:contain;border-radius:8px;background:var(--chip)}
.pv-nav{position:absolute;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;opacity:.9}
.pv-nav.prev{left:8px}
.pv-nav.next{right:8px}
.pv-cap{text-align:center;font-size:13px;color:var(--muted);padding:0 16px 8px}
@media (min-width:820px){
  .masonry{padding:10px 10px 40px}
}
@media (min-width:820px){
  .list{padding:14px 20px 40px}
  .card{padding:13px 14px}
  .thumb{width:80px;height:80px}
}

.subhead{margin:22px 0 8px;align-items:center;gap:8px}
.subhead h4{margin:0;flex:1}
.subhead .btn{min-height:44px;padding:10px 14px}
.fcheck{flex:none;width:44px;height:44px;margin:0 0 0 -6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.fcheck input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.fl li.pickable{cursor:pointer;min-height:44px}
.mini.gsel{min-height:44px;padding:8px 12px;font-size:13px}
.batchbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + var(--sab));padding-left:max(14px,var(--sal));padding-right:max(14px,var(--sar));background:var(--card);border-top:1px solid var(--line);box-shadow:var(--shadow)}
.batchbar[hidden]{display:none}
.batchbar-n{flex:1;min-width:0;font-weight:600;font-size:14px}
.batchbar .btn{min-height:44px;padding:10px 14px}
.batchbar .btn:disabled{opacity:.4;cursor:default}
#settings.selecting .panel{padding-bottom:calc(96px + var(--sab))}
.mpick{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.mpick[hidden]{display:none}
.mpick-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.mpick-card{position:relative;width:100%;max-width:520px;max-height:min(70vh,560px);overflow:auto;background:var(--card);color:var(--text);border-radius:16px 16px 0 0;padding:6px 8px calc(12px + var(--sab));box-shadow:var(--shadow)}
.mpick-title{font-weight:600;font-size:16px;padding:12px 14px 8px}
.mpick-list button{display:block;width:100%;text-align:left;min-height:44px;padding:12px 14px;border:0;background:transparent;border-radius:10px;font:inherit;color:inherit;cursor:pointer}
.mpick-list button:active,.mpick-list button:hover{background:var(--chip)}
.mpick-list button.mpick-new{color:var(--accent);font-weight:600}
.mpick-list button.mpick-cancel{margin-top:4px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="bar">
      <h1><img src="icon-192.png" alt=""><span class="title-text">信息流</span></h1>
      <button class="ib" id="btnMode" type="button" title="当前为信息流，点按切换到图流" aria-label="当前为信息流，点按切换到图流" aria-pressed="false">信息流</button>
      <button class="ib" id="btnRefresh" title="刷新" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="ib" id="btnTheme" title="主题" aria-label="切换主题"><span id="themeIcon">🌓</span></button>
      <button class="ib" id="btnSettings" title="订阅与设置" aria-label="订阅与设置"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
    <div class="navrow">
      <nav class="chips" id="chips" aria-label="筛选"></nav>
      <div class="colctl" id="colctl" hidden>
        <button type="button" id="colMinus" aria-label="减少列数">−</button>
        <button type="button" id="colAuto" aria-label="列数，点按恢复自动" title="点按恢复自动">自动</button>
        <button type="button" id="colPlus" aria-label="增加列数">+</button>
      </div>
    </div>
    <div class="status" id="status"></div>
    <button type="button" class="fresh" id="fresh" hidden>有 <span class="fresh-n">0</span> 条新内容</button>
  </div>

  (function bindHeaderScroll() {
    var top = $('top'), spacer = $('topSpacer');
    if (!top || !spacer) return;
    var st = { y: 0, lastY: 0, acc: 0, hidden: false, headerH: 0, sheetOpen: false, maxY: 0 };
    var ticking = false;
    function measure() {
      var h = top.offsetHeight || 0;
      spacer.style.height = h + 'px';
      st.headerH = h;
    }
    function apply(hidden) {
      st.hidden = !!hidden;
      top.classList.toggle('is-hidden', st.hidden);
    }
    function sheetOpen() { return !!document.querySelector('.sheet.open'); }
    function maxScroll() {
      var el = document.scrollingElement || document.documentElement;
      return Math.max(0, (el.scrollHeight - (el.clientHeight || 0)) || 0);
    }
    function step() {
      ticking = false;
      st.headerH = top.offsetHeight || st.headerH;
      st.sheetOpen = sheetOpen();
      st.maxY = maxScroll();
      var y = window.scrollY || window.pageYOffset || 0;
      var next = C.headerScrollStep(st, y);
      st.y = next.y; st.lastY = next.lastY; st.acc = next.acc;
      if (next.hidden !== st.hidden) apply(next.hidden);
      pokeBatchSentinels();
    }
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(step);
    }
    function showNow() {
      st.acc = 0;
      st.y = st.lastY = Math.max(0, window.scrollY || window.pageYOffset || 0);
      apply(false);
    }
    measure();
    if (window.ResizeObserver) {
      try { new ResizeObserver(function () { measure(); }).observe(top); } catch (e) { }
    }
    window.addEventListener('resize', measure);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', measure);
    window.addEventListener('scroll', onScroll, { passive: true });
    window.RSSHeader = { measure: measure, show: showNow, step: step };
  })();

    }

    var groupsHtml = state.groups.slice().concat([{ id: '', name: '未分组' }]).map(function (g) {
      var fs = state.feeds.filter(function (f) { return (f.groupId || '') === g.id; });
      if (!g.id && !fs.length) return '';
      var headBtns = batchSel.on && fs.length ? '<button type="button" class="mini gsel" data-gsel="' + esc(g.id) + '">全选本组</button>' : '';
      return '<div class="gh"><span>' + esc(g.name) + '</span><span class="badge">' + fs.length + '</span><span class="sp"></span>' + headBtns + '</div>' +
        '<div class="box"><ul class="fl">' + (fs.length ? fs.map(function (f) {
          var n = (itemsByFeed[f.id] || []).length;
          var check = batchSel.on
            ? '<label class="fcheck"><input type="checkbox" data-fcheck="' + esc(f.id) + '"' + (batchSel.ids[f.id] ? ' checked' : '') + ' aria-label="选择 ' + esc(feedName(f)) + '"></label>'
            : '';
          var edit = batchSel.on ? '' : '<button class="mini" data-fedit="' + esc(f.id) + '">⋯</button>';
          var badge = batchSel.on ? '' : (f.error ? '<span class="badge err">失败</span>' : f.fetchedAt ? '<span class="badge ok" title="' + esc(C.routeLabel(f.route || 'direct')) + '">' + n + ' 篇 · ' + esc(C.routeLabel(f.route || 'direct')) + '</span>' : '<span class="badge">未抓取</span>');
          return '<li' + (batchSel.on ? ' class="pickable"' : '') + '>' + check + '<div class="n"><b>' + esc(feedName(f)) + '</b><small>' + esc(f.url) + '</small>' +
            (badge ? '<div class="fmeta">' + badge + '</div>' : '') +
            (f.error ? '<small style="color:var(--danger);white-space:normal">' + esc(f.error) + '</small>' : '') + '</div>' +
            edit + '</li>';
        }).join('') : '<li><div class="n"><small>空分组</small></div></li>') + '</ul></div>';
    }).join('');
    $('setBody').innerHTML =
      '<div class="row"><button class="btn" id="sAdd" style="flex:1">添加订阅</button>' + (batchSel.on ? '' : '<button type="button" class="btn ghost" id="sBatch" style="flex:1">批量移动</button>') + '</div>' +
      '<div class="row"><button type="button" class="btn ghost" id="sGroups" style="flex:1">管理分组</button></div>' +
      '<div class="row subhead"><h4>订阅（' + state.feeds.length + '）</h4></div>' +
      (groupsHtml || '<p class="note">还没有订阅。</p>');
    $('sAdd').onclick = function () { history.back(); setTimeout(openAdder, 60); };
    $('sGroups').onclick = function () { setSettingsTab('groups'); };
    var b = $('setBody');
    b.querySelectorAll('[data-fedit]').forEach(function (x) { x.onclick = function () { if (batchSel.on) return; editFeed(feedById(x.dataset.fedit)); }; });
    b.querySelectorAll('[data-gsel]').forEach(function (x) { x.onclick = function () {
      var gid = x.getAttribute('data-gsel') || '';
      var fs = state.feeds.filter(function (f) { return (f.groupId || '') === gid; });
      var allOn = fs.length && fs.every(function (f) { return batchSel.ids[f.id]; });
      fs.forEach(function (f) { if (allOn) delete batchSel.ids[f.id]; else batchSel.ids[f.id] = 1; });
      fs.forEach(function (f) {
        var cb = b.querySelector('input[data-fcheck="' + CSS.escape(f.id) + '"]');
        if (cb) cb.checked = !allOn;
      });
      updateBatchBar();
    }; });
    b.querySelectorAll('input[data-fcheck]').forEach(function (cb) {
      cb.onchange = function () {
        var id = cb.getAttribute('data-fcheck');
        if (cb.checked) batchSel.ids[id] = 1; else delete batchSel.ids[id];
        updateBatchBar();
      };
    });
    if (batchSel.on) {
      b.querySelectorAll('li.pickable').forEach(function (li) {
        li.onclick = function (e) {
          if (e.target.closest('input,button,label')) return;
          var cb = li.querySelector('input[data-fcheck]');
          if (!cb) return;
          cb.checked = !cb.checked;
          if (cb.onchange) cb.onchange();
        };
      });
    }
    var sBatch = $('sBatch');
    if (sBatch) sBatch.onclick = function () { batchSel.on = true; batchSel.ids = {}; renderSettings(); };
    updateBatchBar();
    $('settings').scrollTop = setScroll;
  }

  function batchSelectedIds() {
    return Object.keys(batchSel.ids).filter(function (k) { return batchSel.ids[k]; });
  }
  function updateBatchBar() {
    var n = batchSelectedIds().length;
    $('settings').classList.toggle('selecting', !!batchSel.on && currentSettingsTab() === 'feeds');
    $('batchBar').hidden = !batchSel.on || currentSettingsTab() !== 'feeds';
    $('batchCount').textContent = '已选 ' + n + ' 个';
    $('batchMove').disabled = n === 0;
  }
  function hideMovePick() { $('movePick').hidden = true; }
  function exitBatchMode(rerender) {
    batchSel.on = false;
    batchSel.ids = {};
    hideMovePick();
    $('settings').classList.remove('selecting');
    if ($('batchBar')) $('batchBar').hidden = true;
    if (rerender && $('settings').classList.contains('open')) renderSettings();
  }
  function openMovePick() {
    if (!batchSel.on || !batchSelectedIds().length) return;
    var html = state.groups.map(function (g) {
      return '<button type="button" data-mg="' + esc(g.id) + '">' + esc(g.name) + '</button>';
    }).join('') +
      '<button type="button" data-mg="">未分组</button>' +
      '<button type="button" class="mpick-new" data-mg="__new">新建分组…</button>' +
      '<button type="button" class="mpick-cancel" id="movePickCancel">取消</button>';
    $('movePickList').innerHTML = html;
    $('movePick').hidden = false;
    $('movePickList').querySelectorAll('[data-mg]').forEach(function (x) {
      x.onclick = function () { applyBatchMoveTo(x.getAttribute('data-mg')); };
    });
    $('movePickCancel').onclick = function () { hideMovePick(); };
  }
  function applyBatchMoveTo(key) {
    var ids = batchSelectedIds();
    if (!ids.length) return;
    var groupId = '', groupName = '未分组';
    if (key === '__new') {
      var name = (prompt('新分组名称') || '').trim();
      if (!name) return;
      var g = state.groups.find(function (x) { return x.name === name; });
      if (!g) { g = C.makeGroup(name); state.groups.push(g); C.applyNavOrder(state); }
      groupId = g.id; groupName = g.name;
    } else if (key) {
      var dest = groupById(key);
      if (!dest) return;
      groupId = dest.id; groupName = dest.name;
    }
    var n = C.moveFeeds(state, ids, groupId);
    if (!n) return;
    save();
    exitBatchMode(false);
    renderSettings();
    renderChips();
    renderMain();
    toast('已移动 ' + n + ' 个源到「' + groupName + '」');
  }
  function editFeed(f) {
    var li = document.querySelector('[data-fedit="' + f.id + '"]').closest('li');
    li.style.flexWrap = 'wrap';
    li.innerHTML = '<div style="width:100%;display:grid;gap:8px"><input type="text" id="eT" value="' + esc(f.title) + '" placeholder="名称"><input type="url" id="eU" value="' + esc(f.url) + '"><select id="eG">' + groupOptions(f.groupId) + '</select>' +
      '<div class="row"><button class="btn danger" id="eDel">取消订阅</button><span style="flex:1"></span><button class="btn ghost" id="eNow">抓一次</button><button class="btn" id="eOk">保存</button></div></div>';
    $('eOk').onclick = function () { f.title = $('eT').value.trim(); var nu = $('eU').value.trim(); if (nu && nu !== f.url) { f.url = nu; f.route = ''; } f.groupId = pickGroup($('eG')); save(); renderSettings(); renderChips(); renderMain(); };
    $('eNow').onclick = function () { $('eNow').disabled = true; refreshAll([f]); };
    $('eDel').onclick = function () { if (!confirm('取消订阅「' + feedName(f) + '」？收藏的文章会保留。')) return; state.feeds = state.feeds.filter(function (y) { return y !== f; }); delete itemsByFeed[f.id]; idbDel(f.id); if (view.type === 'feed' && view.id === f.id) { view = C.fixView(state, C.defaultView(state)); syncModeFromView(); } save(); renderSettings(); renderChips(); renderMain(); };
  }
  $('btnSettings').onclick = function () { exitBatchMode(false); renderSettings(); openSheet('settings'); };
  $('batchCancel').onclick = function () { exitBatchMode(true); };
  $('batchMove').onclick = function () { openMovePick(); };
  $('movePickBg').onclick = function () { hideMovePick(); };


  /* ---------- 启动 ---------- */
  async function boot() {
    applyTheme();
    var had = load();
    var seeded = false;
    if (!had) {
      C.mergeDefaults(state);
      save();
      seeded = true;
    } else {
      save();
    }
    db = await openDB();
    itemsByFeed = await idbAll();
    setView(C.defaultView(state));
    var stale = C.shouldAutoRefresh({
      now: Date.now(), feeds: state.feeds, lastRefreshAt: state.settings.lastRefreshAt,
      online: navigator.onLine, refreshing: refreshing, sheetOpen: false, lastAttemptAt: 0
    });
    if ((seeded || stale) && navigator.onLine !== false) {
      lastAutoAttempt = Date.now();
      refreshAll();
    }
    if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () { });
  }
  function maybeResumeRefresh() {
    if (!C.shouldAutoRefresh({
      now: Date.now(), feeds: state.feeds, lastRefreshAt: state.settings.lastRefreshAt,
      online: navigator.onLine, refreshing: refreshing,
      sheetOpen: !!document.querySelector('.sheet.open'),
      lastAttemptAt: lastAutoAttempt
    })) return;
    lastAutoAttempt = Date.now();
    refreshAll();
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') maybeResumeRefresh();
  });
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) maybeResumeRefresh();
  });
  window.RSSApp = { state: function () { return state; }, items: function () { return itemsByFeed; }, importOPMLText: importOPMLText, refreshAll: refreshAll, restoreDefaults: function () { var before = state.feeds.length; var added = C.mergeDefaults(state); if (added) { save(); renderChips(); renderMain(); } return added; }, setView: setView, setMode: setMode, toggleViewMode: toggleViewMode, setSettingsTab: setSettingsTab, clearChipCooldown: function () { chipRefreshAt = {}; }, openPic: openPic, openItem: function (i) { openItem(current[i]); }, ready: boot() };
})();

</script>
</body>
</html>
