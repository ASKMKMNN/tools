<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="在这台设备上记录书、动漫、剧集、电影和游戏">
<meta name="theme-color" content="#f5f6f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="书影游助手">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>书影游助手</title>
<style>
:root{
  --bg:#f5f6f8; --bg-blur:rgba(245,246,248,.88);
  --card:#ffffff; --text:#16181d; --muted:#63666e;
  --line:#e7e9ee; --accent:#1d5fd0; --accent-soft:rgba(59,130,246,.12);
  --good:#059669; --good-soft:rgba(16,185,129,.14);
  --warn:#8a5200; --warn-soft:rgba(245,158,11,.16);
  --danger:#c62b22; --star:#f59e0b; --star-off:#d8dbe1;
}
[data-theme="dark"]{
  --bg:#0f1115; --bg-blur:rgba(15,17,21,.88);
  --card:#191c23; --text:#e9ebef; --muted:#848b97;
  --line:#282d37; --accent:#60a5fa; --accent-soft:rgba(96,165,250,.16);
  --good:#34d399; --good-soft:rgba(52,211,153,.15);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.15);
  --danger:#f87171; --star:#fbbf24; --star-off:#3a4150;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
input,textarea,select{-webkit-user-select:text;user-select:text}
.topbar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px;
  background:var(--bg-blur);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  max-width:600px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo-svg{display:block;border-radius:7px;box-shadow:0 0 0 1px var(--line)}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.3px}
.brand .sub{margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.35}
.top-actions{display:flex;gap:7px;flex:0 0 auto}
.icon-btn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:16px;
  display:grid;place-items:center;cursor:pointer;line-height:1;padding:0;
}
.icon-btn:active{transform:scale(.93)}
.filters{max-width:600px;margin:0 auto;padding:8px 12px 0;display:flex;gap:6px;overflow-x:auto}
.filters::-webkit-scrollbar{display:none}
.filter-btn{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;
}
.filter-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{max-width:600px;margin:0 auto;padding:10px 12px 100px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.card-top{display:flex;align-items:center;gap:6px}
.title{margin:0;font-size:14.5px;font-weight:650;line-height:1.35;flex:1;word-break:break-word}
.pill{
  flex:0 0 auto;border:none;background:var(--accent-soft);color:var(--accent);
  border-radius:999px;font-size:10.5px;padding:3px 7px;font-family:inherit;cursor:pointer;
}
.more-btn{
  width:26px;height:26px;border-radius:8px;border:none;background:transparent;
  color:var(--muted);font-size:17px;cursor:pointer;padding:0;
}
.card-body{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:9px}
.col{min-width:0}
.col-right{text-align:right}
.lbl{font-size:10.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.2px}
.stepper{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.step-btn{
  width:32px;height:30px;border:none;border-radius:8px;background:transparent;
  color:var(--text);font-size:18px;font-weight:600;cursor:pointer;padding:0;
}
.cur-input{
  width:44px;height:30px;border:none;background:transparent;color:var(--text);
  text-align:center;font-size:16px;font-weight:750;font-family:inherit;padding:0;
  -moz-appearance:textfield;
}
.cur-input::-webkit-outer-spin-button,.cur-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cur-input:focus{outline:none}
.latest-num{font-size:21px;font-weight:750;line-height:1;letter-spacing:-.4px}
.latest-num .unit{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:2px}
.cycle-text{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
}
.foot-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0;flex:1;flex-wrap:wrap}
.badge{font-size:11px;font-weight:650;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.plain{background:var(--accent-soft);color:var(--accent)}
.next-text{font-size:10.5px;color:var(--muted);text-align:right;line-height:1.35}
.stars{display:flex;gap:1px;align-items:center}
.star{
  width:24px;height:24px;border:none;background:transparent;color:var(--star-off);
  font-size:17px;padding:0;cursor:pointer;
}
.star.on{color:var(--star)}
.stars-lg .star{width:36px;height:36px;font-size:24px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty p{margin:4px 0;font-size:13.5px}
.fab{
  position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:50%;border:none;background:var(--accent);color:#fff;
  font-size:28px;box-shadow:0 8px 22px rgba(59,130,246,.4);cursor:pointer;z-index:20;
}
.overlay{
  position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .22s;
}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-width:560px;background:var(--card);border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(20px);transition:transform .26s cubic-bezier(.22,.7,.3,1);
  max-height:92vh;overflow-y:auto;
}
.overlay.show .sheet{transform:translateY(0)}
@media(min-width:600px){
  .overlay{align-items:center}
  .sheet{border-radius:18px;max-width:480px}
}
@media(min-width:760px){
  .topbar,.filters{max-width:900px}
  .list{max-width:900px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  .list .card{margin-bottom:0}
  .list .empty{grid-column:1/-1}
}
.sheet-h{margin:0 0 6px;font-size:17px;font-weight:750}
.sheet-desc{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.6}
.sheet-title{font-size:14px;font-weight:650;margin:0 0 8px;color:var(--muted);word-break:break-word}
.sheet-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:14px 12px;border:none;background:transparent;color:var(--text);
  font-size:14.5px;font-family:inherit;text-align:left;border-radius:11px;cursor:pointer;
}
.sheet-item.danger{color:var(--danger)}
.sheet-item.cancel{justify-content:center;color:var(--muted);margin-top:6px;border-top:1px solid var(--line);border-radius:0}
.muted{color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);margin:8px 2px 0;line-height:1.55}
.warnbox{font-size:12px;line-height:1.55;background:var(--warn-soft);color:var(--text);padding:8px 10px;border-radius:10px;margin:8px 0}
.field{margin-bottom:12px;min-width:0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;
}
.field textarea{min-height:88px;resize:vertical}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.checkline{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;margin:8px 0}
.checkline input{margin-top:2px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg-btn{
  flex:1;padding:8px 4px;border:none;background:transparent;color:var(--muted);
  font-size:13px;font-weight:650;font-family:inherit;border-radius:8px;cursor:pointer;
}
.seg-btn.on{background:var(--accent);color:#fff}
.sheet-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{
  flex:1;min-width:88px;padding:12px 10px;border-radius:12px;border:1px solid transparent;
  font-size:14px;font-weight:650;font-family:inherit;cursor:pointer;
}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.title-row{display:flex;gap:8px}
.title-row input{flex:1}
.title-row .btn{flex:0 0 auto}
.src-list{margin-top:8px;border:1px solid var(--line);border-radius:11px;max-height:40vh;overflow:auto}
.src-list:empty{display:none}
.src-item{display:flex;gap:8px;width:100%;padding:8px 10px;border:none;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:left;font-family:inherit;cursor:pointer}
.src-item img{width:36px;height:50px;object-fit:cover;border-radius:4px;background:var(--line)}
.src-item .t{font-size:13.5px;font-weight:650}
.src-item .s{font-size:11px;color:var(--muted);margin-top:2px}
.avail-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.avail-row select,.avail-row input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:13px}
.video-box{background:#000;border-radius:12px;overflow:hidden;margin:8px 0}
.video-box video{width:100%;max-height:240px;display:block}
.thumb{width:100%;max-height:180px;object-fit:contain;border-radius:12px;background:var(--bg);margin:8px 0}
.toast{
  position:fixed;left:50%;bottom:92px;transform:translate(-50%,10px);
  background:rgba(20,22,28,.92);color:#fff;padding:10px 14px;border-radius:12px;
  font-size:13px;z-index:300;opacity:0;transition:.25s;pointer-events:none;
  max-width:88vw;line-height:1.4;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.card.has-poster{position:relative;overflow:hidden;isolation:isolate;color:#fff;padding-top:84px;background:#1b2028;border-color:transparent}
.poster{position:absolute;inset:0;z-index:-2}
.poster img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.card.has-poster::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.82))}
.has-poster .title,.has-poster .pill{color:#fff}
.has-poster .pill{background:rgba(255,255,255,.18)}
.has-poster .lbl,.has-poster .cycle-text,.has-poster .next-text,.has-poster .latest-num .unit{color:rgba(255,255,255,.82)}
.has-poster .card-foot{border-top-color:rgba(255,255,255,.22)}
.has-poster .stepper,.has-poster .badge{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.has-poster .step-btn,.has-poster .cur-input{color:#fff}
.has-poster .star{color:rgba(255,255,255,.4)}
.has-poster .star.on{color:#fbbf24}
.cover-fix{display:block;width:100%;box-sizing:border-box;margin:0 0 8px;padding:7px 10px;border:1px dashed var(--line);border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-size:12px;text-align:left;cursor:pointer}
.cover-fix:active{background:var(--accent-soft)}
.cover-list{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:11px;margin:8px 0}
.cover-list:empty{display:none}
.cover-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.cover-row:last-child{border-bottom:none}
.cover-row .t{flex:1 1 40%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover-row .why{flex:0 1 44%;color:var(--muted);font-size:11px;line-height:1.35}
.cover-row button{flex:0 0 auto;font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--accent);cursor:pointer}
.conflict{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.hidden{display:none !important}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo-svg" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#14161c"/>
      <rect x="12" y="22" width="40" height="28" rx="6" fill="#f4f6fb"/>
      <rect x="16" y="26" width="32" height="18" rx="3" fill="#12141c"/>
      <path d="M29 31l8 4-8 4z" fill="#3b82f6"/>
    </svg>
    <div>
      <h1>书影游助手</h1>
      <p class="sub" id="summary" data-pit="0">库是空的</p>
    </div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btnTheme" type="button" title="切换主题">🌙</button>
    <button class="icon-btn" id="btnMore" type="button" title="数据与设置">⋯</button>
  </div>
</header>
<div class="filters" id="typeFilters" role="tablist">
  <button type="button" class="filter-btn on" data-type="all">全部</button>
  <button type="button" class="filter-btn" data-type="book">书</button>
  <button type="button" class="filter-btn" data-type="anime">动漫</button>
  <button type="button" class="filter-btn" data-type="series">剧集</button>
  <button type="button" class="filter-btn" data-type="movie">电影</button>
  <button type="button" class="filter-btn" data-type="game">游戏</button>
</div>
<div class="filters" id="statusFilters" role="tablist">
  <button type="button" class="filter-btn on" data-ps="all">全部状态</button>
  <button type="button" class="filter-btn" data-ps="planned">想看</button>
  <button type="button" class="filter-btn" data-ps="in_progress">在看</button>
  <button type="button" class="filter-btn" data-ps="completed">已看</button>
</div>
<main class="list" id="list"></main>
<button class="fab" id="btnAdd" type="button" aria-label="添加">＋</button>
<script>
(function () {
  const KEY = 'anime-tracker-v1';
  const AI_STORE = 'anime-tracker-v1-ai';
  const TMDB_STORE = 'anime-tracker-v1-tmdb';
  const SNAP_KEY = 'anime-tracker-v1-rollback';
  const BGM = 'https://api.bgm.tv';
  const VISION_MODELS = ['deepseek-flash', 'deepseek-v4-flash', 'deepseek-v4-flash-vision-exp'];
  const MEDIA = ['book', 'anime', 'series', 'movie', 'game'];
  const MEDIA_LABEL = { book: '书', anime: '动漫', series: '剧集', movie: '电影', game: '游戏', all: '全部' };
  const STATUS_LABEL = {
    book: { planned: '想读', in_progress: '在读', completed: '已读' },
    game: { planned: '想玩', in_progress: '在玩', completed: '已玩' },
    anime: { planned: '想看', in_progress: '在看', completed: '已看' },
    series: { planned: '想看', in_progress: '在看', completed: '已看' },
    movie: { planned: '想看', in_progress: '在看', completed: '已看' }
  };
  const REGIONS = [
    { id: 'CN', label: '中国大陆' }, { id: 'HK', label: '香港' }, { id: 'TW', label: '台湾' },
    { id: 'JP', label: '日本' }, { id: 'US', label: '美国' }, { id: 'unknown', label: '未指定' }
  ];
  const PLATFORMS = [
    { id: 'cinema', label: '影院' }, { id: 'bilibili', label: '哔哩哔哩' }, { id: 'iqiyi', label: '爱奇艺' },
    { id: 'tencent', label: '腾讯视频' }, { id: 'youku', label: '优酷' }, { id: 'netflix', label: 'Netflix' },
    { id: 'disney', label: 'Disney+' }, { id: 'steam', label: 'Steam' }, { id: 'digital', label: '数字商店' },
    { id: 'physical', label: '实体' }, { id: 'bookstore', label: '书店' }, { id: 'other', label: '其他' }
  ];
  const EVENTS = [
    { id: 'theatrical', label: '影院上映' }, { id: 'streaming', label: '流媒体上线' },
    { id: 'digital', label: '数字发售' }, { id: 'physical', label: '实体发售' },
    { id: 'early_access', label: '抢先体验' }, { id: 'broadcast', label: '开播' }, { id: 'other', label: '其他' }
  ];
  const REGION_IDS = REGIONS.map(function (x) { return x.id; });
  const PLATFORM_IDS = PLATFORMS.map(function (x) { return x.id; });
  const EVENT_IDS = EVENTS.map(function (x) { return x.id; });
  const SECRET_NAME = /^(api[_-]?key|apikey|key|token|secret|password|authorization|access[_-]?token|tmdbkey|deepseekkey)$/i;

  let todayOverride = null;
  let data = { items: [], theme: 'auto', prefs: { region: '', platforms: [] } };
  const ui = { typeFilter: 'all', psFilter: 'all' };
  const ai = { endpoint: 'https://api.deepseek.com', model: 'deepseek-flash', key: '', remember: false, keyEndpoint: '', confirmed: false };
  const tmdb = { key: '', remember: false, confirmed: false };
  let pendingImage = null;

  function pad(n) { return String(n).padStart(2, '0'); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function labelOf(list, id) {
    for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i].label;
    return id || '';
  }
  function statusLabel(status, mediaType) {
    const table = STATUS_LABEL[mediaType] || STATUS_LABEL.anime;
    return table[status] || status;
  }
  function isEpisode(item) { return item.mediaType === 'anime' || item.mediaType === 'series'; }
  function isPit(item) { return item.personalStatus === 'planned' || item.personalStatus === 'in_progress'; }

  function isValidYMD(y, m, d) {
    if (!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d)) return false;
    if (m < 1 || m > 12 || d < 1 || d > 31 || y < 1) return false;
    const utc = new Date(Date.UTC(y, m - 1, d));
    return utc.getUTCFullYear() === y && utc.getUTCMonth() === m - 1 && utc.getUTCDate() === d;
  }
  function formatParts(p) { return p.y + '-' + pad(p.m) + '-' + pad(p.d); }
  function todayParts(now) {
    const d = now instanceof Date ? now : new Date();
    return { y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate() };
  }
  function todayStr() {
    if (todayOverride) return todayOverride;
    return formatParts(todayParts(new Date()));
  }
  function parseYMD(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '').trim());
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    if (!isValidYMD(y, mo, d)) return null;
    return { y: y, m: mo, d: d };
  }
  function parseYM(s) {
    const m = /^(\d{4})-(\d{2})$/.exec(String(s || '').trim());
    if (!m) return null;
    const mo = +m[2];
    if (mo < 1 || mo > 12) return null;
    return { y: +m[1], m: mo };

  async function httpJSON(method, url, body, opts) {

        credentials: 'omit',

        referrerPolicy: 'no-referrer'

      const err = new Error('NETWORK');
      err.cors = true;
      err.causeName = e && e.name;
      throw err;
    }
    const text = await response.text();
    let json = null;
    if (text) { try { json = JSON.parse(text); } catch (e) { json = null; } }
    if (!response.ok) {
      const err = new Error('HTTP ' + response.status);

  async function bgmFetch(id) {
    const s = await httpJSON('GET', BGM + '/v0/subjects/' + id);
    const out = { cover: bigCover(s.images), name: s.name_cn || s.name, type: s.type, date: s.date || '', platform: s.platform || '' };
    try {
    if (s.type === 2 || s.type === 6) {
      let eps = [], offset = 0;
      for (let guard = 0; guard < 8; guard++) {
        const r = await httpJSON('GET', BGM + '/v0/episodes?subject_id=' + id + '&type=0&limit=100&offset=' + offset);
        const batch = r.data || [];
        eps = eps.concat(batch);
        offset += batch.length;
        if (batch.length < 100 || eps.length >= (r.total || 0)) break;
      }
      const today = todayStr();
      const aired = eps.filter(function (e) { return parseYMD(e.airdate) && e.airdate <= today; })
        .sort(function (a, b) { return a.airdate < b.airdate ? -1 : a.airdate > b.airdate ? 1 : ((a.sort || 0) - (b.sort || 0)); });
      out.total = s.total_episodes || s.eps || 0;
      if (!out.total && eps.length && s.total_episodes === 0) out.total = 0;
      if (aired.length) {
        const last = aired[aired.length - 1];
        const epNo = Math.round(Number(last.ep) || 0);
        out.latest = epNo > 0 ? epNo : aired.length;
        out.latestDate = last.airdate;
        const dates = [];
        aired.forEach(function (e) { if (dates.indexOf(e.airdate) < 0) dates.push(e.airdate); });
        const recent = dates.slice(-5);
        const gaps = [];
        for (let i = 1; i < recent.length; i++) {
          const a = parseYMD(recent[i - 1]), b = parseYMD(recent[i]);
          if (a && b) gaps.push(daysBetweenParts(a, b));
        }
        if (gaps.length) {
          const sorted = gaps.slice().sort(function (x, y) { return x - y; });
          const g = sorted[Math.floor((sorted.length - 1) / 2)];
          if (g > 0) out.cycle = g;

        else if (appliedSource) it.latestOrigin = appliedSource;
        if (totalTouched) it.totalOrigin = 'manual';
      }
      if (it.mediaType === 'book') {
        it.bookProgress = normalizeBook({ mode: bookMode.value, value: bookValue.value });
      }
      if (it.mediaType === 'game') {
        it.gameProgress = normalizeGame({ percent: gamePct.value.trim() === '' ? null : gamePct.value, note: gameNote.value });
      }
      it.updatedAt = Date.now();
      const clean = normalize(it);
      if (isNew) data.items.unshift(clean);
      else {
        const i = data.items.findIndex(function (x) { return x.id === clean.id; });
        if (i >= 0) data.items[i] = clean; else data.items.unshift(clean);
      }
      save();
      overlay.close();
      render();
      toast(isNew ? '已添加' : '已保存');
    });
    if (opts.autoSearch && title.value.trim()) runSearch(title.value.trim(), typeSel.value, results, it, fillFromHit);
  }
  function attributionText(it) {
    const bits = [];
    if (it.bgmId) bits.push('Bangumi ' + it.bgmId + (it.bgmSyncedAt ? ' · ' + new Date(it.bgmSyncedAt).toLocaleString() : ''));
    if (it.tmdbId) bits.push('TMDB ' + it.tmdbId);
    if (it.olKey) bits.push('Open Library ' + it.olKey);
    if (it.tmdbId) bits.push('本工具使用 TMDB API，但未获 TMDB 认可或认证。');
    return bits.join(' ');

  async function runSearch(keyword, mediaType, box, draft, onPick) {
    if (!keyword) { toast('先写名称'); return; }
    box.textContent = '';
    box.appendChild(h('div', { class: 'hint' }, '正在查询…'));
    const errors = [];
    const hits = [];
    const typeMap = { book: [1], anime: [2], series: [6], movie: [2, 6], game: [4] };
    try { hits.push.apply(hits, await bgmSearch(keyword, typeMap[mediaType] || [1, 2, 4, 6])); }
    catch (e) { errors.push('Bangumi：' + networkMessage(e)); }
    if (mediaType === 'book') {
      try { hits.push.apply(hits, await olSearch(keyword)); }
      catch (e) { errors.push('Open Library：' + networkMessage(e)); }
    }
    if ((mediaType === 'movie' || mediaType === 'series') && tmdb.confirmed && tmdb.key) {
      try {
        const kind = mediaType === 'movie' ? 'movie' : 'tv';
        const found = await tmdbGET('/search/' + kind + '?query=' + encodeURIComponent(keyword) + '&language=zh-CN&include_adult=false', tmdb.key);
        const first = ((found && found.results) || []).slice(0, 5);
        for (let i = 0; i < first.length; i++) {
          const r = first[i];
          let availability = [];
          if (kind === 'movie') {
            try { availability = mapTmdbReleaseDates(await tmdbGET('/movie/' + r.id + '/release_dates', tmdb.key), r.id); }
            catch (e) {}
          }
          if (!availability.length) {
            const loose = precisionFromLoose(r.release_date || r.first_air_date || '');
            if (loose.precision !== 'tbd') {
              availability.push({
                region: 'unknown', platform: 'other', event: kind === 'movie' ? 'theatrical' : 'broadcast',
                date: loose, source: 'tmdb', sourceId: String(r.id) + ':search', fetchedAt: Date.now(),
                note: 'TMDB 搜索日期，尚未按地区拆开，不能当成当地可看日'
              });
            }
          }
          try { availability = availability.concat(mapTmdbProviders(await tmdbGET('/' + kind + '/' + r.id + '/watch/providers', tmdb.key), r.id)); }
          catch (e) {}
          hits.push({
            source: 'tmdb', id: r.id, media: kind,
            title: r.title || r.name || '', author: '',
            date: (r.release_date || r.first_air_date || ''),
            cover: r.poster_path ? ('https://image.tmdb.org/t/p/w185' + r.poster_path) : '',
            availability: availability,
            name: r.original_title || r.original_name || ''
          });
        }
      } catch (e) { errors.push('TMDB：' + networkMessage(e)); }
    } else if (mediaType === 'movie' || mediaType === 'series') {
      errors.push('TMDB：未确认密钥，已跳过。可以只凭 Bangumi 或手填。');
    }
    box.textContent = '';
    if (!hits.length) box.appendChild(h('div', { class: 'hint' }, '没有选到条目。可以直接手动填。'));
    hits.forEach(function (hit) {
      const titleText = hit.title || hit.nameCn || hit.name || '';
      const sub = (hit.source || '') + (hit.date ? ' · ' + hit.date : '') + (hit.platform ? ' · ' + hit.platform : '') + (hit.name && hit.name !== titleText ? ' · ' + hit.name : '');
      const btn = h('button', { type: 'button', class: 'src-item' },
        hit.thumb || hit.cover ? h('img', { alt: '', src: safeHttpUrl(hit.thumb || hit.cover) || '' }) : h('span', null, ''),
        h('span', null, h('div', { class: 't' }, titleText), h('div', { class: 's' }, sub))
      );
      const img = btn.querySelector('img');
      if (img && !img.getAttribute('src')) img.remove();
      btn.addEventListener('click', function () { onPick(hit); });
      box.appendChild(btn);
    });
    errors.forEach(function (msg) { box.appendChild(h('div', { class: 'hint' }, msg)); });
    box.appendChild(h('div', { class: 'hint' }, '点一条只是填草稿。不点保存就不会入库，也不会改已有进度。'));
  }

  async function aiChat(ready, opts) {
    opts = opts || {};
    const modelName = ready.model || 'deepseek-flash';
    if (opts.imageDataUrl && VISION_MODELS.indexOf(modelName) < 0 && !ready.allowOther) {
      const e = new Error('NO_VISION_MODEL'); e.code = 'NO_VISION_MODEL'; throw e;
    }
    const content = opts.imageDataUrl ? [
      { type: 'text', text: '只根据这一张图片提取基础信息。只返回 JSON，不要 Markdown。格式：{"title":"","author":"","type":"book|anime|series|movie|game|unknown"}。type 只能是这几个词。不要猜测集数、总集数或上线日期。看不清就留空，type 用 unknown。' },
      { type: 'image_url', image_url: { url: opts.imageDataUrl, detail: 'low' } }
    ] : 'ping';
    const url = chatUrl(ready.endpoint);
    let response;
    try {
      response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json', Authorization: 'Bearer ' + ready.key },
        body: JSON.stringify({ model: modelName, messages: [{ role: 'user', content: content }], max_tokens: opts.probe ? 16 : 300, stream: false }),
        credentials: 'omit', cache: 'no-store', redirect: 'error', referrerPolicy: 'no-referrer'
      });
    } catch (e) {
      const err = new Error('NETWORK'); err.cors = true; err.causeName = e && e.name; throw err;
    }
    const text = await response.text();
    if (!response.ok) { const err = new Error('HTTP ' + response.status); err.status = response.status; throw err; }
    let json = {};
    try { json = JSON.parse(text); } catch (e) { json = {}; }
    const message = json && json.choices && json.choices[0] && json.choices[0].message;
    return message ? (message.content || '') : '';
  }

      if (confirm.checked) {
        if (!k) { confirm.checked = false; toast('先填写密钥'); return; }
        tmdb.key = k; tmdb.confirmed = true;
      } else tmdb.confirmed = false;
      tmdb.remember = remember.checked;
      persistTmdb();
    }
    confirm.addEventListener('change', sync);
    remember.addEventListener('change', function () {
      tmdb.remember = remember.checked;
      if (!tmdb.remember) { localStorage.removeItem(TMDB_STORE); return; }
      tmdb.key = key.value.trim(); persistTmdb();
    });
    key.addEventListener('input', function () { if (key.value.trim() !== tmdb.key) { tmdb.confirmed = false; confirm.checked = false; } });
    const test = h('button', { class: 'btn ghost', type: 'button', id: 'tmdbTest' }, '测试连接');
    const clear = h('button', { class: 'btn ghost', type: 'button' }, '清除密钥');
    test.addEventListener('click', async function () {
      if (!confirm.checked || !key.value.trim()) { toast('先填写并确认密钥'); return; }
      tmdb.key = key.value.trim(); tmdb.confirmed = true;
      try {
        await tmdbGET('/configuration', tmdb.key);
        toast('TMDB 连接成功');
      } catch (e) { toast(networkMessage(e)); }
    });
    clear.addEventListener('click', function () {
      tmdb.key = ''; tmdb.confirmed = false; tmdb.remember = false;
      key.value = ''; confirm.checked = false; remember.checked = false;
      localStorage.removeItem(TMDB_STORE);
      toast('已清除 TMDB 密钥');
    });
    createOverlay(h('div', null,
      h('h2', { class: 'sheet-h' }, 'TMDB'),
      h('p', { class: 'sheet-desc' }, '只在查询电影或剧集时把密钥发给 api.themoviedb.org。不会附在海报图片请求上。没有密钥时可以手填，或只用 Bangumi。'),
      field('密钥（v3 key 或 Read Access Token）', key),
      h('label', { class: 'checkline' }, confirm, '我确认把密钥只发给 api.themoviedb.org'),
      h('div', { class: 'warnbox' }, '记住后同样写入这个网站来源的 localStorage，和 AI 密钥一样，同源页面可能读到。v3 key 会作为查询参数出现在开发者工具的请求地址里。导出备份不含它。'),
      h('label', { class: 'checkline' }, remember, '记住在这台设备'),
      h('div', { class: 'sheet-actions' }, test, clear),
      h('p', { class: 'hint' }, '本工具使用 TMDB API，但未获 TMDB 认可或认证。This product uses the TMDB API but is not endorsed or certified by TMDB.')
    ));
  }

  function setPendingImage(blob) {
    if (pendingImage && pendingImage.url) URL.revokeObjectURL(pendingImage.url);
    pendingImage = { blob: blob, url: URL.createObjectURL(blob), dataUrl: '' };
  }
  function openVision(draft, isNew) {
    const notice = h('p', { class: 'warnbox' }, '选图或拍照只留在这次打开的内存里，不会上传。只有点「识别这一张」才会把这一张图片发到你填写的 AI 端点。不会写入备份或服务线程缓存。');
    const preview = h('img', { class: 'thumb hidden', alt: '待识别的图片' });
    const file = h('input', { id: 'visionFile', type: 'file', accept: 'image/jpeg,image/png,image/gif,image/webp' });
    const cameraBtn = h('button', { class: 'btn ghost', type: 'button', id: 'cameraBtn' }, '拍照');
    const fallback = h('div', { id: 'cameraFallback', class: 'hint hidden' });
    const videoBox = h('div', { class: 'video-box hidden', id: 'videoBox' });
    const video = document.createElement('video');
    video.setAttribute('playsinline', ''); video.autoplay = true; video.muted = true;
    const shutter = h('button', { class: 'btn primary', type: 'button' }, '用这一帧');
    const closeCam = h('button', { class: 'btn ghost', type: 'button' }, '关闭相机');
    videoBox.appendChild(video);
    videoBox.appendChild(h('div', { class: 'sheet-actions' }, closeCam, shutter));
    let stream = null;
    function stopStream() { if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } videoBox.classList.add('hidden'); }
    function showPreview() {
      preview.src = pendingImage.url; preview.classList.remove('hidden');
    }
    file.addEventListener('change', function () {
      const f = file.files && file.files[0];
      if (!f) return;
      if (!/^image\/(jpeg|png|gif|webp)$/.test(f.type)) { toast('只接受 JPEG、PNG、GIF、WebP'); return; }
      setPendingImage(f); showPreview();
      toast('已选中一张，还没有上传');
    });
    cameraBtn.addEventListener('click', async function () {
      fallback.classList.add('hidden');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        fallback.textContent = '这个浏览器没有相机接口。请改用上面的选图。';
        fallback.classList.remove('hidden');
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        videoBox.classList.remove('hidden');
      } catch (e) {
        const name = e && e.name;
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError') fallback.textContent = '相机权限被拒绝。可以改用选图。页面不会在后台打开相机。';
        else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') fallback.textContent = '没有找到相机。请改用选图。';
        else fallback.textContent = '相机不可用（' + (name || '未知原因') + '）。请改用选图。';
        fallback.classList.remove('hidden');
      }
    });
    closeCam.addEventListener('click', stopStream);
    shutter.addEventListener('click', function () {
      const w = video.videoWidth || 0, hgt = video.videoHeight || 0;
      if (!w || !hgt) { fallback.textContent = '没有取到画面，请改用选图。'; fallback.classList.remove('hidden'); return; }
      const canvas = document.createElement('canvas');
      const scale = Math.min(1, 1280 / Math.max(w, hgt));
      canvas.width = Math.round(w * scale); canvas.height = Math.round(hgt * scale);
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function (blob) { setPendingImage(blob); showPreview(); stopStream(); toast('已截取一帧，还没有上传'); }, 'image/jpeg', 0.85);
    });
    const go = h('button', { class: 'btn primary', type: 'button', id: 'visionGo' }, '识别这一张');
    const out = h('div', { id: 'visionOut' });
    go.addEventListener('click', async function () {
      if (!pendingImage) { toast('先选一张图'); return; }
      let ready;
      try {
        if (typeof window.__readAiForm === 'function') ready = window.__readAiForm();
        else if (ai.confirmed && ai.key && ai.keyEndpoint === normalizeEndpoint(ai.endpoint)) ready = { endpoint: ai.endpoint, key: ai.key, model: ai.model || 'deepseek-flash', allowOther: false };
        else ready = null;
      } catch (e) { toast(networkMessage(e)); return; }
      if (!ready) { toast('请先在 AI 接口里填写端点、模型和密钥，并确认端点'); openAiSheet(); return; }
      out.textContent = '正在压缩并上传这一张…';
      const dataUrl = await blobToDataUrl(pendingImage.blob);
      try {
        const content = await aiChat(ready, { imageDataUrl: dataUrl });
        const extracted = sanitizeExtract(content);
        out.textContent = '';
        out.appendChild(h('p', { class: 'hint' }, '识别到的标题：' + (extracted.title || '（空）')));
        out.appendChild(h('p', { class: 'hint' }, '作者：' + (extracted.author || '（空）')));
        out.appendChild(h('p', { class: 'hint' }, '类型：' + (extracted.type === 'unknown' ? '未能判断' : MEDIA_LABEL[extracted.type])));
        const use = h('button', { class: 'btn primary', type: 'button' }, '用这个标题去匹配');
        const manual = h('button', { class: 'btn ghost', type: 'button' }, '不匹配，手动填写');
        function seedFromExtract() {
          const base = draft ? JSON.parse(JSON.stringify(draft)) : {};
          if (extracted.title) base.title = extracted.title;
          if (extracted.author) base.author = extracted.author;
          if (extracted.type !== 'unknown') base.mediaType = extracted.type;
          if (!base.personalStatus) base.personalStatus = 'planned';
          return base;
        }
        use.addEventListener('click', function () {
          const seed = seedFromExtract();
          overlay.close();
          setTimeout(function () { openEditDialog(isNew ? null : draft, { asNew: !!isNew, seed: seed, autoSearch: true }); }, 220);
        });
        manual.addEventListener('click', function () {
          const seed = seedFromExtract();
          overlay.close();
          setTimeout(function () { openEditDialog(isNew ? null : draft, { asNew: !!isNew, seed: seed, autoSearch: false }); }, 220);
        });
        out.appendChild(h('div', { class: 'sheet-actions' }, manual, use));
        out.appendChild(h('p', { class: 'hint' }, '还没有写入片单。'));
      } catch (e) {
        out.textContent = '';
        out.appendChild(h('p', { class: 'hint' }, networkMessage(e)));
      }
    });
    const overlay = createOverlay(h('div', null,
      h('h2', { class: 'sheet-h' }, '识别一张图'),
      notice, file, cameraBtn, fallback, videoBox, preview, go, out
    ));
    overlay.addEventListener('click', function (e) { if (e.target === overlay) stopStream(); });
  }
  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || '')); };
      reader.onerror = function () { reject(new Error('read')); };
      const img = new Image();
      const url = URL.createObjectURL(blob);
      img.onload = function () {
        const scale = Math.min(1, 1280 / Math.max(img.width || 1, img.height || 1));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round((img.width || 1) * scale));
        canvas.height = Math.max(1, Math.round((img.height || 1) * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reader.readAsDataURL(blob); };
      img.src = url;
    });
  }
  function runSearchIntoEdit() { /* search stays inside the edit sheet; user presses 查资料 */ }

  function bangumiId(value) {
    if (value && typeof value === 'object') value = value.id != null ? value.id : '';
    const s = String(value == null ? '' : value).trim();
    if (!s) return 0;
    let n = Number(s);
    if (!Number.isInteger(n) || n <= 0) {
      const m = /bgm\.tv|subject\//i.test(s) ? s.match(/(?:subject\/|\/)(\d{1,9})(?:[^\d]|$)/) : null;
      n = m ? Number(m[1]) : 0;
    }
    return Number.isInteger(n) && n > 0 ? n : 0;
  }
  function legacyBgmId(o) {
    let raw = o.bgmId;
    if (raw == null || raw === '') raw = o.bangumiId;
    if (raw == null || raw === '') raw = o.subjectId;
    if (raw == null || raw === '') raw = o.bgm_id;
    if ((raw == null || raw === '') && o.source && typeof o.source === 'object' && /bangumi/i.test(String(o.source.source || ''))) raw = o.source.id;
    return bangumiId(raw);
  }
  function withTimeout(p, ms, label) {
    return new Promise(function (resolve, reject) {
      let done = false;
      const timer = setTimeout(function () { if (!done) { done = true; reject(new Error('TIMEOUT:' + label)); } }, ms);
      p.then(function (v) { if (!done) { done = true; clearTimeout(timer); resolve(v); } },
             function (e) { if (!done) { done = true; clearTimeout(timer); reject(e); } });
    });
  }
  let refreshing = false;
  async function refreshAll(manual) {
    if (refreshing) return;
    const bound = data.items.filter(function (x) { return bangumiId(x.bgmId); });
    const unbound = data.items.filter(function (x) {
      return !safeHttpUrl(x.cover || '') && !!coverLocalOf(x) && !bangumiId(x.bgmId);
    });
    if (!bound.length) {
      if (manual) {
        toast('没有可查询的 Bangumi 编号。' + (unbound.length ? unbound.length + ' 条只有手机本地封面，请用「逐条补封面」。' : '浏览器打不开手机里保存的封面文件。'));
        if (unbound.length) openCoverSheet([]);
      }
      return;
    }
    refreshing = true;
    if (manual) toast('正在刷新 ' + bound.length + ' 条的资料和封面');
    let covers = 0, kept = 0;
    const report = [];
    for (let i = 0; i < bound.length; i++) {
      const it = bound[i];
      const hadCover = !!safeHttpUrl(it.cover);
      if (!manual && hadCover && it.bgmSyncedAt && Date.now() - it.bgmSyncedAt < 30 * 60 * 1000) continue;
      const progress = {
        current: it.current, personalStatus: it.personalStatus, stars: it.stars,
        latest: it.latest, latestDate: it.latestDate, cycle: it.cycle, total: it.total,
        bookProgress: it.bookProgress, gameProgress: it.gameProgress
      };
      try {
        const info = await withTimeout(bgmFetch(bangumiId(it.bgmId)), 12000, 'Bangumi');
        if (info.cover) {
          it.cover = info.cover;
          covers++;
          clearCoverIssue(it.id);
          report.push({ id: it.id, title: it.title, ok: true });
        } else {
          markCoverIssue(it.id, '接口没返回封面');
          report.push({ id: it.id, title: it.title, ok: false, why: '接口没返回封面' });
        }
        it.bgmName = info.name || it.bgmName;
        it.bgmType = info.type || it.bgmType;
        it.bgmSyncedAt = Date.now();
        if (info.date) mergeAvailability(it, bgmAvailabilityDraft(it.bgmId, info.date, info.platform));
        const allowCatalog = isEpisode(it) && it.latestOrigin === 'bangumi';
        if (allowCatalog && info.latest > 0 && info.latestDate) {
          it.latest = info.latest;
          it.latestDate = info.latestDate;
          if (info.cycle) it.cycle = info.cycle;
          if (info.total > 0 && it.totalOrigin !== 'manual') it.total = info.total;
        } else if (info.latest > 0 && (info.latest !== progress.latest || info.latestDate !== progress.latestDate)) {
          it.latestSuggestion = { latest: info.latest, latestDate: info.latestDate, cycle: info.cycle || 0, total: info.total || 0, source: 'bangumi', at: Date.now() };
          kept++;
        }
      } catch (e) {
        const why = /^TIMEOUT/.test(String(e && e.message)) ? '请求超时（12 秒）' : networkMessage(e);
        markCoverIssue(it.id, why);
        report.push({ id: it.id, title: it.title, ok: false, why: why });
      }
      it.current = progress.current;
      it.personalStatus = progress.personalStatus;
      it.stars = progress.stars;
      it.bookProgress = progress.bookProgress;
      it.gameProgress = progress.gameProgress;
      if (!(isEpisode(it) && it.latestOrigin === 'bangumi')) {
        it.latest = progress.latest;
        it.latestDate = progress.latestDate;
        it.cycle = progress.cycle;
        it.total = progress.total;
      }
    }
    refreshing = false;
    save();
    if (!document.querySelector('.overlay')) render();
    if (manual) {
      const failed = report.filter(function (r) { return !r.ok; }).length;
      toast('刷新结束：网络封面 ' + covers + ' 条' + (failed ? '，失败 ' + failed + ' 条' : '')
        + (kept ? '。原有进度未改' : '') + (unbound.length ? '。另有 ' + unbound.length + ' 条无编号需手动补图' : ''));
      if (failed || unbound.length) openCoverSheet(report);
    }
  }

  function init() {
    load();
    loadSecrets();
    applyTheme();
    render();
    document.getElementById('btnAdd').addEventListener('click', function () { openEditDialog(null); });
    document.getElementById('btnMore').addEventListener('click', openSettings);
    document.getElementById('btnTheme').addEventListener('click', function () {
      data.theme = currentTheme() === 'dark' ? 'light' : 'dark';
      save(); applyTheme();
    });
    document.getElementById('typeFilters').addEventListener('click', function (e) {
      const btn = e.target.closest('[data-type]');
      if (!btn) return;
      ui.typeFilter = btn.dataset.type;
      document.querySelectorAll('#typeFilters .filter-btn').forEach(function (b) { b.classList.toggle('on', b === btn); });
      render();
    });
    document.getElementById('statusFilters').addEventListener('click', function (e) {
      const btn = e.target.closest('[data-ps]');
      if (!btn) return;
      ui.psFilter = btn.dataset.ps;
      document.querySelectorAll('#statusFilters .filter-btn').forEach(function (b) { b.classList.toggle('on', b === btn); });
      render();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      const ovs = document.querySelectorAll('.overlay.show');
      if (ovs.length) ovs[ovs.length - 1].close();
    });
    window.addEventListener('offline', function () { toast('现在离线，仍可改本地记录'); });
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      const hadController = !!navigator.serviceWorker.controller;
      let swReloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || swReloading) return;
        swReloading = true;
        toast('已更新到新版本，正在重新载入');
        setTimeout(function () { location.reload(); }, 900);
      });
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
    }
  }

  window.ZF = {
    KEY: KEY, AI_STORE: AI_STORE, TMDB_STORE: TMDB_STORE, SNAP_KEY: SNAP_KEY,
    normalize: normalize, inferPersonal: inferPersonal, theoreticalLatest: theoreticalLatest,
    airedGap: airedGap, episodeFacts: episodeFacts, workFinished: workFinished,
    pickAvailability: pickAvailability, describeAccess: describeAccess, daysUntil: daysUntil,
    addDays: addDays, parseYMD: parseYMD, isValidYMD: isValidYMD, precisionFromLoose: precisionFromLoose,
    planImport: planImport, applyImport: applyImport, stripSecrets: stripSecrets, counts: counts, isPit: isPit,
    sanitizeExtract: sanitizeExtract, mapBgmHit: mapBgmHit, mapOlDoc: mapOlDoc,
    mapTmdbReleaseDates: mapTmdbReleaseDates, mapTmdbProviders: mapTmdbProviders,
    bgmSearch: bgmSearch, olSearch: olSearch, networkMessage: networkMessage,
    setToday: function (s) { todayOverride = s || null; },
    getToday: todayStr,
    items: function () { return data.items; },
    prefs: function () { return data.prefs; },
    exportPayload: buildPayload,
    readBackup: readBackup,
    setPrefs: function (p) { data.prefs = normalizePrefs(p); save(); render(); },
    replaceLibrary: function (items) { data.items = (items || []).map(normalize); save(); render(); }
  };
  init();
})();
