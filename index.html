<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小工具</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f4f5f7;
            --text: #1c1c1f;
            --muted: #71717a;
            --card: #ffffff;
            --line: rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141416;
                --text: #f4f5f7;
                --muted: #a1a1aa;
                --card: #1e1e22;
                --line: rgba(255, 255, 255, 0.06);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 56px 20px 72px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .lead {
            margin: 0 0 28px;
            color: var(--muted);
            line-height: 1.65;
            font-size: 15px;
        }

        nav { display: grid; gap: 12px; }

        a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            text-decoration: none;
            color: inherit;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
        }

        a:hover { border-color: rgba(127, 127, 127, 0.35); }

        img {
            width: 64px;
            height: 64px;
            border-radius: 14px;
        }

        strong {
            display: block;
            font-size: 17px;
        }

        small {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main>
        <h1>小工具</h1>
        <p class="lead">几个可以单独安装的网页工具。请打开对应页面，再用浏览器的「安装」或「添加到主屏幕」。装好后断网也能打开。</p>
        <nav>
            <a href="freq/">
                <img src="freq/icon-192.png" width="64" height="64" alt="" />
                <span>
                    <strong>周期频率换算器</strong>
                    <small>周期与频率互相换算</small>
                </span>
            </a>
            <a href="price/">
                <img src="price/icon-192.png" width="64" height="64" alt="" />
                <span>
                    <strong>省钱比价</strong>
                    <small>比较两个选项的单价，看哪个更划算</small>
                </span>
            </a>
            <a href="apps/">
                <img src="apps/icon-192.png" width="64" height="64" alt="" />
                <span>
                    <strong>好用 App 清单</strong>
                    <small>个人试过的好用 App 思维导图</small>
                </span>
            </a>
            <a href="fruit/">
                <img src="fruit/icon-192.png" width="64" height="64" alt="" />
                <span>
                    <strong>大连水果月历</strong>
                    <small>按月对照大连当季水果</small>
                </span>
            </a>
        </nav>
    </main>
</body>
</html>
