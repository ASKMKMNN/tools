<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小工具</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="icon" href="icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f4f1;
            --text: #1d1b18;
            --muted: #5f5f66;
            --card: #fffdfa;
            --line: rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1917;
                --text: #f0ece5;
                --muted: #a49f97;
                --card: #24221f;
                --line: rgba(255, 255, 255, 0.06);
            }
        }

        * { box-sizing: border-box; }

        /* 设计自查：A7 横向溢出 / A2 焦点态 / C1 数字对齐 */
        html, body { overflow-x: clip; }
        body { font-variant-numeric: tabular-nums; }
        a:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid var(--text);
            outline-offset: 2px;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 56px 20px 72px;
        }

        h1 {
            font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
            margin: 0 0 10px;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .lead {
            margin: 0 0 28px;
            color: var(--muted);
            line-height: 1.68;
            font-size: 16px;
        }

        nav { display: grid; gap: 12px; }

        a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            text-decoration: none;
            color: inherit;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
        }

        a:hover { border-color: rgba(127, 127, 127, 0.35); }

        img {
            width: 64px;
            height: 64px;
            border-radius: 6px;
        }

        strong {
            display: block;
            font-size: 17px;
        }

        small {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 14px;
        }

        .section {
            margin: 0 0 12px;
            font-size: 14px;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        nav + .section { margin-top: 32px; }

        /* C3：桌面区只有一张卡，给它另一种疏密，避免整页同一配方 */
        nav.single a { padding: 18px 16px; border-radius: 22px; }
    </style>
</head>
<body>
    <main>
        <h1>小工具</h1>
        <p class="lead">几个可以单独安装的网页工具。请打开对应页面，再用浏览器的「安装」或「添加到主屏幕」。装好后断网也能打开。Windows 脚本在下方「桌面」，下载解压即用。</p>
        <p class="section">网页</p>
        <nav>
            <a href="freq/">
                <img src="freq/icon-192.png" width="64" height="64" alt="" />
                <span>
                    <strong>周期频率换算器</strong>
                    <small>周期与频率互相换算</small>
                </span>
            </a>
            <a href="price/">
                <img src="price/icon-192.png" width="64" height="64" alt="" />
                <span>
                    <strong>省钱比价</strong>
                    <small>比较两个选项的单价，看哪个更划算</small>
                </span>
            </a>
            <a href="md/">
                <img src="md/icon-192.png" width="64" height="64" alt="" />
                <span>
                    <strong>Markdown 编辑器</strong>
                    <small>本地 Markdown 编辑与预览，支持贴图、收藏、历史</small>
                </span>
            </a>
            <a href="mind/">
                <img src="mind/icon-192.png" width="64" height="64" alt="" />
                <span>
                    <strong>QuickMind 思维导图</strong>
                    <small>用文本大纲快速生成思维导图</small>
                </span>
            </a>
            <a href="apps/">
                <img src="apps/icon-192.png" width="64" height="64" alt="" />
                <span>
                    <strong>好用 App 清单</strong>
                    <small>个人试过的好用 App 思维导图</small>
                </span>
            </a>
            <a href="fruit/">
                <img src="fruit/icon-192.png" width="64" height="64" alt="" />
                <span>
                    <strong>大连水果月历</strong>
                    <small>按月对照大连当季水果</small>
                </span>
            </a>
        </nav>
        <p class="section">桌面</p>
        <nav class="single">
            <a href="win/">
                <img src="win/icon.png" width="64" height="64" alt="" />
                <span>
                    <strong>Windows 工具</strong>
                    <small>.bat / .vbs / .hta · 下载解压即用</small>
                </span>
            </a>
        </nav>
    </main>
</body>
</html>
